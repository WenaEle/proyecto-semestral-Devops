name: Pipeline CI/CD - AWS CLI & ECR Despliegue

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    name: Configurar AWS CLI, Compilar y Publicar en ECR
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código desde GitHub
        uses: actions/checkout@v3

      # Configura el AWS CLI usando los secrets de tu laboratorio de AWS Academy
      - name: 2. Configurar credenciales de AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crítico para AWS Academy
          aws-region: us-east-1

      # Inicia sesión en AWS ECR usando las herramientas oficiales (Ya NO usa docker/login-action)
      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 4. Construir y Publicar API Despachos en AWS ECR
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/api-despachos:latest ./back-Despachos_SpringBoot
          docker push ${{ steps.login-ecr.outputs.registry }}/api-despachos:latest

      - name: 5. Construir y Publicar API Ventas en AWS ECR
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/api-ventas:latest ./back-Ventas_SpringBoot
          docker push ${{ steps.login-ecr.outputs.registry }}/api-ventas:latest

      - name: 6. Construir y Publicar Frontend en AWS ECR
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/frontend-app:latest ./front_despacho
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend-app:latest

  deploy-to-ec2:
    name: Conectarse a AWS EC2 y Desplegar
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 1. Conexión SSH a AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/proyecto-devops
            cd ~/proyecto-devops
            # Aquí automatizaremos la descarga desde ECR y el encendido