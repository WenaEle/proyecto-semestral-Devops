version: '3.8'

services:
  # Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ordenes_db
    ports:
      - "3306:3306"
    volumes:
      - datos-mysql:/var/lib/mysql

  # API Ventas
  back-ventas:
    image: 711817139890.dkr.ecr.us-east-1.amazonaws.com/api-ventas:latest
    container_name: api-ventas-container
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ordenes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

  # API Despachos
  back-despachos:
    image: 711817139890.dkr.ecr.us-east-1.amazonaws.com/api-despachos:latest
    container_name: api-despachos-container
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ordenes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

  # Frontend (React)
  frontend:
    image: 711817139890.dkr.ecr.us-east-1.amazonaws.com/frontend-app:latest
    container_name: react-frontend-container
    ports:
      - "3000:3000"
    depends_on:
      - back-ventas
      - back-despachos

volumes:
  datos-mysql: